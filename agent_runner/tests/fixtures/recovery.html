<!doctype html><meta charset="utf-8"><title>Community message</title>
<h1>Publish a community message</h1>
<p>Publishing requires a profile. Your name will be shared with this site.</p>
<button id="publish" onclick="document.querySelector('dialog').showModal()">Publish Hello</button>
<dialog><h2>Create your profile</h2><p>Your name will be shared with this site.</p>
<form onsubmit="event.preventDefault(); document.querySelector('dialog').close(); document.getElementById('result').textContent='Published: Hello'; document.getElementById('publish').disabled=true;">
<label>Full name <input name="fullname" required autocomplete="off"></label>
<label>Email <input name="email" type="email" required autocomplete="off"></label>
<label>Password <input name="password" type="password" required autocomplete="new-password"></label>
<button type="submit">Create profile and publish</button>
<button type="button" onclick="document.querySelector('dialog').close()">Cancel</button>
</form></dialog><p id="result" role="status"></p>
